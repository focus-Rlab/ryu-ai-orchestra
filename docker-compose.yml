services:
  gateway:
    build:
      context: .
      dockerfile: gateway_service/Dockerfile
    environment:
      RAPHAEL_GATEWAY_KEY: ${RAPHAEL_GATEWAY_KEY:-raphael-local}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.openai.com/v1}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-gpt-5-mini}
    volumes:
      - raphael-data:/data
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    depends_on:
      - gateway
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://gateway:8000/v1
      OPENAI_API_KEY: ${RAPHAEL_GATEWAY_KEY:-raphael-local}
      ENABLE_OLLAMA_API: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      WEBUI_NAME: Raphael
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  raphael-data:
  open-webui-data:
